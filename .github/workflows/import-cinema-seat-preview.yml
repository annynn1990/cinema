name: Import Codrops Cinema Seat Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-cinema-seat-preview.yml"

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy the complete upstream project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/codrops/CinemaSeatPreview.git "$tmp/source"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$tmp/source/" ./
          rm -f .github/workflows/import-cinema-seat-preview.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No file changes to import."
            exit 0
          fi
          git commit -m "Import Codrops CinemaSeatPreview project"
          git push origin HEAD:main
