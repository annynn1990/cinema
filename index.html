<!DOCTYPE html>
<html lang="zh-Hant" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>電影座位預覽 | Codrops</title>
    <meta name="description" content="在 3D 電影院中選擇座位，前往該座位欣賞電影，並體驗電影畫面照亮影廳與 4D 特效。使用 three.js 與 TSL 製作。" />
    <meta name="keywords" content="cinema, seat preview, seating plan, 4d cinema, three.js, webgpu, tsl, 3d" />
    <meta name="author" content="Codrops" />
    <link rel="icon" type="image/svg+xml" href="https://tympanus.net/favicon/favicon.svg" />
    <link rel="shortcut icon" href="https://tympanus.net/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" type="text/css" href="css/base.css" />
    <script>document.documentElement.className = 'js';</script>
    <script type="importmap">
      {
        "imports": {
          "three": "./js/lib/three.webgpu.js",
          "three/webgpu": "./js/lib/three.webgpu.js",
          "three/tsl": "./js/lib/three.tsl.js",
          "three/addons/": "./js/lib/addons/"
        }
      }
    </script>
  </head>
  <body class="loading">
    <div class="loader" role="progressbar" aria-label="正在載入影廳">
      <div class="loader__battery"><span class="loader__level"></span></div>
      <span class="loader__percent">2%</span>
    </div>
    <div class="theater" role="img" aria-label="這是一座 3D 影廳。選擇影廳中的座位或座位圖上的座位，即可前往該處觀看銀幕。"></div>
    <header class="frame">
      <h1 class="frame__title">電影座位預覽</h1>
    </header>

    <aside class="panel" aria-label="座位">
      <div class="panel__card panel__head">
        <div>
          <h2 class="panel__title">選擇座位</h2>
          <p class="panel__meta">Charge · 今晚 20:30 · 第 1 廳</p>
        </div>
        <button class="panel__close" type="button" aria-label="關閉座位圖">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="preview">
        <div class="preview__window"></div>
        <p class="preview__empty">指向座位即可預覽該座位的視角</p>
        <p class="preview__caption" aria-live="polite"></p>
      </div>
      <div class="panel__card panel__map">
        <div class="map"></div>
        <ul class="legend">
          <li class="legend__item legend__item--free">可選</li>
          <li class="legend__item legend__item--taken">已售出</li>
          <li class="legend__item legend__item--yours">已選</li>
          <li class="legend__item legend__item--best">最佳視野</li>
        </ul>
      </div>
      <div class="panel__card tickets">
        <h3 class="tickets__title">我的票券</h3>
        <ul class="tickets__list"></ul>
        <p class="tickets__empty">選擇座位後，即可將座位加入票券。</p>
        <div class="tickets__footer">
          <span class="tickets__total"></span>
          <button class="tickets__book" type="button" disabled>預訂</button>
        </div>
      </div>
    </aside>

    <div class="seat-label" aria-hidden="true"><span class="seat-label__pill"></span></div>

    <div class="dock">
      <button class="dock__play" type="button" aria-label="播放電影">
        <svg class="dock__icon dock__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
        <svg class="dock__icon dock__icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
      </button>
      <button class="dock__round dock__stop" type="button" aria-label="停止電影並打開影廳燈光" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
      </button>
      <div class="dock__film">
        <span class="dock__title">Charge</span>
        <span class="dock__meta">Blender Studio · 2022</span>
      </div>
      <span class="dock__divider" aria-hidden="true"></span>
      <span class="dock__status" aria-live="polite">選擇座位以查看該座位的視角</span>
      <button class="dock__button dock__add" type="button" hidden>加入</button>
      <button class="dock__button dock__stand" type="button" aria-label="離開座位" hidden>
        <svg class="dock__stand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6M6.5 11.5L12 6l5.5 5.5" /></svg>
        <span class="dock__stand-label">離開座位</span>
      </button>
      <span class="dock__divider" aria-hidden="true"></span>
      <button class="dock__fx" type="button" aria-pressed="true" title="4D 特效：霧氣、煙霧、火花、閃光與座椅動態">
        <span class="dock__fx-label">4D</span><span class="dock__fx-dot" aria-hidden="true"></span>
      </button>
      <button class="dock__round dock__sound" type="button" aria-pressed="false" aria-label="關閉音效">
        <svg class="dock__glyph dock__glyph--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" /></svg>
        <svg class="dock__glyph dock__glyph--off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
      </button>
      <button class="dock__round dock__tilt" type="button" aria-pressed="false" aria-label="傾斜手機以環顧四周" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="stroke" x="7.5" y="3.5" width="9" height="17" rx="2" /><path class="stroke" d="M3 9.5a9 9 0 000 5M21 9.5a9 9 0 010 5" /></svg>
      </button>
      <button class="dock__round dock__seats" type="button" aria-label="座位圖">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3v3H4zM10.5 7h3v3h-3zM17 7h3v3h-3zM4 14h3v3H4zM10.5 14h3v3h-3zM17 14h3v3h-3z" /></svg>
      </button>
    </div>
    <p class="keys" aria-label="操作提示"></p>

    <div class="toast" role="status" aria-live="polite"></div>
    <p class="no-3d__message">此展示需要支援 WebGPU 或 WebGL 2 的瀏覽器。</p>
    <div class="fade" aria-hidden="true"></div>
    <video class="film" src="assets/charge.mp4" preload="none" playsinline></video>
    <script src="js/lib/gsap.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
